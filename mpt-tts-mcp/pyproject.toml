# MCP server exposing MoneyPrinterTurbo TTS + subtitle generation.
[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "mpt-tts-mcp"
version = "0.1.0"
description = "MCP server for text-to-speech and subtitle generation, extracted from MoneyPrinterTurbo."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2.0,<2",
    "edge-tts==7.2.7",
    "loguru>=0.7.3",
    "requests>=2.31.0",
    "openai>=2.24.0,<3",
    "moviepy==2.2.1",
    "pydub>=0.25.1",
    "toml>=0.10.2",
    "azure-cognitiveservices-speech==1.41.1",
    "google-genai==2.11.0",
]

[project.scripts]
mpt-tts-mcp = "mpt_tts.server:main"

[tool.hatch.build.targets.wheel]
packages = ["mpt_tts"]
